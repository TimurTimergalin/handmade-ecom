# Общий запуск четырёх частей платформы.
# Из каталога projects:
#   docker compose -f ecom-platform-B2C/docker-compose.yml -f integration/compose.yaml up --build
#
# Фронт отдельно: cd HandmadeGoodsPlatform/ecom-platform && npm run dev
# Витрина: http://localhost:8080   Кабинет: http://localhost:8090   UI: http://localhost:3000
# Оплата самовывоза ходит в YooKassa. Без настоящих YOOKASSA_* заказ создаётся, но paymentUrl пустой.

x-b2b: &b2b-env
  ENVIRONMENT: development
  SERVICE_KEY: dev-only-internal-key-change-before-deployment
  AUTH_DEV_MODE: "false"
  EXTERNAL_FAKE_MODE: "false"
  API_PREFIX: /api
  KAFKA_ENABLED: "true"
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092

services:
  b2c:
    environment:
      B2C_B2B_URL: http://b2b:8000/api
      B2C_B2B_GOODS_URL: http://b2b-goods:8000/api
      SERVICE_KEY: dev-only-internal-key-change-before-deployment
      YOOKASSA_ACCOUNT_ID: ${YOOKASSA_ACCOUNT_ID:-}
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-}
      YANDEX_REDIRECT_URI: ${YANDEX_REDIRECT_URI:-http://localhost:3000/auth/yandex/callback}
      ORDER_PROCESSOR_URL: http://order-processor:8000

  goods:
    environment:
      B2B_GOODS_URL: http://b2b-goods:8000/api
      B2B_URL: http://b2b:8000/api
      USERS_URL: http://users:8000
      SERVICE_KEY: dev-only-internal-key-change-before-deployment
      KAFKA_PRODUCTS_TOPIC: handmade.products.v1

  publications:
    environment:
      B2B_PUBLICATIONS_URL: http://b2b-publications:8000/api
      B2B_URL: http://b2b:8000/api
      USERS_URL: http://users:8000
      SERVICE_KEY: dev-only-internal-key-change-before-deployment
      KAFKA_PUBLICATIONS_TOPIC: handmade.publications.v1

  search:
    environment:
      B2B_GOODS_URL: http://b2b-goods:8000/api
      SERVICE_KEY: dev-only-internal-key-change-before-deployment
      KAFKA_PRODUCTS_TOPIC: handmade.products.v1

  orders:
    environment:
      ORDER_PROCESSOR_URL: http://order-processor:8000
      B2B_URL: http://b2b:8000/api
      SERVICE_KEY: dev-only-internal-key-change-before-deployment

  payments-db-init:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-ecom}
      PGUSER: ${POSTGRES_USER:-ecom}
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - |
        psql -h postgres -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'ecom_payments'" | grep -q 1 \
          || psql -h postgres -d postgres -c "CREATE DATABASE ecom_payments"
        psql -h postgres -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'ecom_scheduler'" | grep -q 1 \
          || psql -h postgres -d postgres -c "CREATE DATABASE ecom_scheduler"

  scheduler:
    build:
      context: ../scheduler
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ecom}:${POSTGRES_PASSWORD:-ecom}@postgres:5432/ecom_scheduler
      B2B_URL: http://b2b:8000/api
      PAYMENT_URL: http://order-processor:8000/api
      SERVICE_KEY: dev-only-internal-key-change-before-deployment
      POLL_SECONDS: "15"
    ports:
      - "8096:8000"
    depends_on:
      payments-db-init:
        condition: service_completed_successfully
      b2b:
        condition: service_started
      order-processor:
        condition: service_started
    restart: unless-stopped

  order-processor:
    build:
      context: ../sem-ecom-platform/services/orders_service
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ecom}:${POSTGRES_PASSWORD:-ecom}@postgres:5432/ecom_payments
      YOOKASSA_ACCOUNT_ID: ${YOOKASSA_ACCOUNT_ID:-000000}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-test_dummy_key}
      YOOKASSA_RETURN_URL: ${YOOKASSA_RETURN_URL:-http://localhost:3000/account/orders}
      YOOKASSA_FAKE: ${YOOKASSA_FAKE:-true}
    ports:
      - "8095:8000"
    depends_on:
      payments-db-init:
        condition: service_completed_successfully
    restart: unless-stopped

  b2b-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${B2B_POSTGRES_PASSWORD:-local-postgres-only}
    volumes:
      - b2b-postgres-data:/var/lib/postgresql/data
      - ../b2b_back/docker/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marketplace"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    build:
      context: ../b2b_back
      dockerfile: docker/Dockerfile.minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-localminio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-localminio-secret}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  minio-init:
    build:
      context: ../b2b_back
    depends_on:
      - minio
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: handmade-media
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-localminio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-localminio-secret}
    command: ["python", "-m", "scripts.minio_init"]
    restart: "no"

  b2b:
    build:
      context: ../b2b_back
    restart: unless-stopped
    environment:
      <<: *b2b-env
      AUTH_DELEGATED: "true"
      DATABASE_URL: postgresql+asyncpg://b2b:b2b@b2b-postgres:5432/marketplace
      USER_SERVICE_URL: http://users:8000/api
      ORDER_SERVICE_URL: http://orders:8000/api
      ANALYTICS_SERVICE_URL: http://users:8000/api
      PAYMENT_SERVICE_URL: http://order-processor:8000/api
      GOODS_SERVICE_URL: http://b2b-goods:8000/api
      PUBLICATIONS_SERVICE_URL: http://b2b-publications:8000/api
      B2B_SERVICE_URL: http://b2b:8000/api
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_URL: http://localhost:9000/handmade-media
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-localminio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-localminio-secret}
      YOOKASSA_OAUTH_CLIENT_ID: ${YOOKASSA_OAUTH_CLIENT_ID:-}
      YOOKASSA_OAUTH_CLIENT_SECRET: ${YOOKASSA_OAUTH_CLIENT_SECRET:-}
      YOOKASSA_OAUTH_REDIRECT_URI: ${YOOKASSA_OAUTH_REDIRECT_URI:-http://localhost:8090/api/seller/yookassa/callback}
      YOOKASSA_OAUTH_FAKE: ${YOOKASSA_OAUTH_FAKE:-true}
      YOOKASSA_STUB_PUBLIC_URL: http://localhost:8095
      YOOKASSA_STUB_URL: http://order-processor:8000
      SELLER_PROFILE_URL: http://localhost:3000/seller/profile
    command:
      [
        "sh",
        "-ec",
        "alembic -c alembic-b2b.ini upgrade head && exec uvicorn marketplace.b2b.main:factory --factory --host 0.0.0.0 --port 8000",
      ]
    ports:
      - "8090:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s
    depends_on:
      b2b-postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      users:
        condition: service_started
      orders:
        condition: service_started

  b2b-goods:
    build:
      context: ../b2b_back
    restart: unless-stopped
    environment:
      <<: *b2b-env
      DATABASE_URL: postgresql+asyncpg://goods:goods@b2b-postgres:5432/marketplace
    command:
      [
        "sh",
        "-ec",
        "alembic -c alembic-goods.ini upgrade head && exec uvicorn marketplace.goods.main:factory --factory --host 0.0.0.0 --port 8000",
      ]
    ports:
      - "8081:8000"
    depends_on:
      b2b-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  b2b-publications:
    build:
      context: ../b2b_back
    restart: unless-stopped
    environment:
      <<: *b2b-env
      DATABASE_URL: postgresql+asyncpg://publications:publications@b2b-postgres:5432/marketplace
      GOODS_SERVICE_URL: http://b2b-goods:8000/api
    command:
      [
        "sh",
        "-ec",
        "alembic -c alembic-publications.ini upgrade head && exec uvicorn marketplace.publications.main:factory --factory --host 0.0.0.0 --port 8000",
      ]
    ports:
      - "8082:8000"
    depends_on:
      b2b-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  b2b-postgres-data:
  minio-data:
